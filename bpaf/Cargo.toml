[package]
name = "bpaf"
version.workspace = true
edition.workspace = true
categories = ["command-line-interface"]
description = "A simple Command Line Argument Parser with parser combinators"
keywords = ["args", "arguments", "cli", "parser", "parse"]
authors.workspace = true
readme = "README.md"
license.workspace = true
repository.workspace = true
rust-version = "1.85"
include = [
  "src/**/*",
  "Cargo.toml",
  "README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "examples/**/*"
]


[dependencies]
bpaf_core = { workspace = true }
bpaf_derive = { workspace = true, optional = true }

[dev-dependencies]
bpaf = { path = ".",  features = ["derive", "extradocs"] }


[package.metadata.docs.rs]
features = ["unstable-docs"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--generate-link-to-definition"]


[features]
derive = ["bpaf_derive"]
default = ["extradocs"]
extradocs = ["bpaf_core/extradocs"]
autocomplete = []

# this feature is used for local development to make it easier to generate documentation
unstable-docs = ["derive", "extradocs", "autocomplete"]
